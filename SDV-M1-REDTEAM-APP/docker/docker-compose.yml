version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: redteam-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redteam_app

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redteam-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=redteam_app
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
    depends_on:
      - mongo
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: redteam-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
