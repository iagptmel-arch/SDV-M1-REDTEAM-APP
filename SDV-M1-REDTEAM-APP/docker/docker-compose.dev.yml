version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: redteam-mongo-dev
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redteam_app

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redteam-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=redteam_app
      - SECRET_KEY=dev-secret-key
      - DEBUG=true
    depends_on:
      - mongo
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: redteam-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo_data_dev:
